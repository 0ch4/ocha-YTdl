<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>ocha-YTdl</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      width: 360px;
      margin: 0;
      padding: 12px 14px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      background: #0f0f0f;
      color: #e8e8e8;
    }

    header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    header h1 { margin: 0; font-size: 14px; font-weight: 700; color: #ff2222; }
    #version   { font-size: 10px; color: #555; margin-left: auto; }
    .maint-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
      color: #777;
      font-size: 10px;
      font-weight: 600;
      white-space: nowrap;
    }
    .maint-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #555;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.04);
      flex: 0 0 auto;
    }
    .maint-latest { color: #64b5f6; }
    .maint-latest .maint-dot { background: #2196f3; box-shadow: 0 0 0 2px rgba(33, 150, 243, 0.18); }
    .maint-checking { color: #777; }
    .maint-checking .maint-dot { background: #666; }
    .maint-unknown { color: #888; }
    .maint-unknown .maint-dot { background: #888; }
    .maint-recommended { color: #e0b000; }
    .maint-recommended .maint-dot { background: #e0b000; box-shadow: 0 0 0 2px rgba(224, 176, 0, 0.18); }
    .maint-required { color: #ff6b6b; }
    .maint-required .maint-dot { background: #ff3b30; box-shadow: 0 0 0 2px rgba(255, 59, 48, 0.18); }

    #video-title {
      font-size: 12px; color: #999;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-bottom: 6px; min-height: 16px;
    }

    #nsig-status {
      display: none;
      font-size: 10px;
      padding: 3px 7px;
      border-radius: 3px;
      margin-bottom: 8px;
    }
    .nsig-ok   { background: #0a2a0a; color: #4caf50; }
    .nsig-fail { background: #2a0a0a; color: #ff6b6b; }

    #pot-status {
      display: none;
      font-size: 10px;
      padding: 3px 7px;
      border-radius: 3px;
      margin-bottom: 8px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .pot-ok   { background: #0a2a0a; color: #4caf50; }
    .pot-warn { background: #2a230a; color: #e0b000; }

    #maintenance-status {
      display: none;
      font-size: 10px;
      padding: 5px 7px;
      border-radius: 4px;
      margin-bottom: 8px;
      line-height: 1.35;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .maint-info { background: #101f2e; color: #64b5f6; }
    .maint-warn { background: #2a230a; color: #e0b000; }
    .maint-critical { background: #2a0a0a; color: #ff6b6b; }
    #maintenance-actions {
      display: none;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin: -4px 0 8px;
    }
    .maint-btn {
      background: #202020; color: #ddd;
      border: 1px solid #3a3a3a; border-radius: 4px;
      padding: 6px 7px; font-size: 11px; font-weight: 600; cursor: pointer;
    }
    .maint-btn:hover { background: #2a2a2a; color: #fff; }

    #status { font-size: 12px; color: #888; padding: 6px 0; }
    #error  { font-size: 12px; color: #ff6b6b; padding: 6px 0; display: none; }

    #quality-picker {
      display: none;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      margin-bottom: 8px;
    }
    .picker-row {
      display: grid;
      grid-column: 1 / -1;
      grid-template-columns: 1fr;
      gap: 4px;
    }
    .picker-filters {
      display: grid;
      grid-column: 1 / -1;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
    }
    .picker-actions {
      display: grid;
      grid-column: 1 / -1;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
    }
    .picker-label {
      color: #777;
      font-size: 10px;
      font-weight: 600;
    }
    .picker-select {
      min-width: 0;
      background: #1a1a1a; color: #e8e8e8;
      border: 1px solid #333; border-radius: 4px;
      padding: 6px 7px; font-size: 12px;
    }
    .picker-btn {
      background: #cc0000; color: #fff;
      border: none; border-radius: 4px;
      padding: 6px 8px; font-size: 11px; font-weight: 600; cursor: pointer;
    }
    .picker-btn:hover { background: #ff2222; }
    .picker-btn:disabled { background: #333; color: #777; cursor: not-allowed; }
    #quality-note {
      display: none;
      color: #888;
      font-size: 10px;
      line-height: 1.35;
      margin: -3px 0 8px;
    }
    #format-debug {
      display: none;
      color: #777;
      font-size: 10px;
      line-height: 1.35;
      margin: -3px 0 8px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    #mux-progress {
      display: none;
      color: #4caf50;
      font-size: 11px;
      line-height: 1.4;
      margin: 2px 0 8px;
    }
    #download-mux-selected { width: 100%; padding: 8px; background: #1565c0; }
    #download-mux-selected:hover { background: #1976d2; }
    #download-mux-selected:disabled { background: #333; color: #777; }

    .section       { display: none; margin-bottom: 10px; }
    .section-label {
      font-size: 10px; font-weight: 600; color: #666;
      text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 5px;
    }
    .fmt-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }

    .fmt-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 7px 10px;
      background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 5px;
      transition: background 0.1s;
    }
    .fmt-item:hover { background: #222; }

    .fmt-left    { display: flex; flex-direction: column; gap: 2px; }
    .fmt-quality { font-weight: 600; font-size: 13px; }
    .fmt-meta    { font-size: 10px; color: #666; }

    .fmt-actions { display: flex; gap: 5px; flex-shrink: 0; }

    .copy-btn {
      background: #2a2a2a; color: #aaa;
      border: 1px solid #3a3a3a; border-radius: 3px;
      padding: 4px 8px; font-size: 10px; cursor: pointer;
      transition: background 0.1s;
    }
    .copy-btn:hover { background: #333; color: #fff; }

    .dl-btn {
      background: #cc0000; color: #fff;
      border: none; border-radius: 3px;
      padding: 4px 12px; font-size: 11px; font-weight: 600; cursor: pointer;
      transition: background 0.1s;
    }
    .dl-btn:hover  { background: #ff2222; }
    .dl-btn:active { background: #aa0000; }

    hr.divider { border: none; border-top: 1px solid #1e1e1e; margin: 8px 0; }
  </style>
</head>
<body>
  <header>
    <h1>ocha-YTdl</h1>
    <span id="maintenance-pill" class="maint-pill maint-checking" title="互換性ステータスを確認中">
      <span class="maint-dot"></span>
      <span id="maintenance-pill-text">status: 確認中</span>
    </span>
    <span id="version">v0.7.2</span>
  </header>

  <div id="video-title"></div>
  <div id="nsig-status"></div>
  <div id="pot-status"></div>
  <div id="maintenance-status"></div>
  <div id="maintenance-actions">
    <button class="maint-btn" id="open-update-guide">更新手順</button>
    <button class="maint-btn" id="reload-extension">再読み込み</button>
  </div>
  <div id="status">読み込み中...</div>
  <div id="error"></div>

  <div id="quality-picker">
    <div class="picker-filters">
      <select class="picker-select" id="video-resolution-select" aria-label="解像度"></select>
      <select class="picker-select" id="video-fps-select" aria-label="フレームレート"></select>
      <select class="picker-select" id="video-ext-select" aria-label="拡張子"></select>
    </div>
    <div class="picker-row">
      <div class="picker-label">映像フォーマット</div>
      <select class="picker-select" id="video-format-select" aria-label="映像フォーマット"></select>
    </div>
    <div class="picker-row">
      <div class="picker-label">音声フォーマット</div>
      <select class="picker-select" id="audio-format-select" aria-label="音声フォーマット"></select>
    </div>
    <div class="picker-actions">
      <button class="picker-btn" id="download-video-selected">映像DL</button>
      <button class="picker-btn" id="download-audio-selected">音声DL</button>
      <button class="picker-btn" id="download-pair-selected">両方DL</button>
    </div>
    <div class="picker-row">
      <button class="picker-btn" id="download-mux-selected">🎬 映像+音声を合成して保存</button>
    </div>
  </div>
  <div id="mux-progress"></div>
  <div id="quality-note"></div>
  <div id="format-debug"></div>

  <div class="section" id="section-muxed">
    <div class="section-label">動画 + 音声</div>
    <ul class="fmt-list" id="list-muxed"></ul>
  </div>

  <hr class="divider" id="divider-video" style="display:none">
  <div class="section" id="section-video">
    <div class="section-label">映像のみ</div>
    <ul class="fmt-list" id="list-video"></ul>
  </div>

  <hr class="divider" id="divider-audio" style="display:none">
  <div class="section" id="section-audio">
    <div class="section-label">音声のみ</div>
    <ul class="fmt-list" id="list-audio"></ul>
  </div>

  <iframe id="solver-iframe" src="/sandbox/solver.html" style="display:none"></iframe>
  <iframe id="muxer-iframe" src="/sandbox/muxer.html" style="display:none"></iframe>
  <iframe id="potgen-iframe" src="/sandbox/potgen.html" style="display:none"></iframe>
  <script src="config/youtube.js"></script>
  <script src="popup.js"></script>
</body>
</html>
