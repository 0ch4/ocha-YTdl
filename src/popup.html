<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>ocha-YTdl</title>
  <style>
    /* 玉露(gyokuro)ダークパレット — ocha-server のデザイントークンを流用 */
    :root {
      --bg: #1B1E1A;
      --surface: #252925;
      --surface-2: #2D322D;
      --surface-3: #353b34;
      --border: #333a30;
      --border-strong: #454d40;
      --text: #E8E2D5;
      --muted: #A19B8E;
      --dim: #948C7E;
      --accent: #8FB37C;        /* 玉露グリーン: 主要アクション/リンク */
      --accent-soft: #9dc189;
      --accent-deep: #5E8048;   /* ボーダー/装飾 */
      --gold: #C9B47A;          /* ごく稀な差し色 */
      --err: #cf8b7e;           /* 茶系に馴染む控えめなテラコッタ赤 */
      --on-accent: #181c14;     /* グリーン面上の文字 */
      --r: 11px; --r-md: 8px; --r-sm: 6px;
      --ring: 0 0 0 2px rgba(143, 179, 124, 0.32);
      --ease: cubic-bezier(0.32, 0.08, 0.24, 1);
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      width: 360px;
      margin: 0;
      padding: 12px 14px 14px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 13px;
      line-height: 1.45;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    /* ── header / brand ───────────────────────────────── */
    header { display: flex; align-items: center; gap: 9px; margin-bottom: 12px; }
    .brand { display: inline-flex; align-items: center; gap: 8px; }
    .brand-mark {
      width: 22px; height: 22px; border-radius: 7px;
      background: var(--accent);
      display: inline-flex; align-items: center; justify-content: center;
      flex: 0 0 auto;
    }
    .brand-mark::after {
      content: ''; width: 0; height: 0; margin-left: 2px;
      border-left: 7px solid var(--bg);
      border-top: 4.5px solid transparent; border-bottom: 4.5px solid transparent;
    }
    .brand-name { font-size: 15px; font-weight: 600; letter-spacing: 0.2px; color: var(--text); }
    .brand-name .dim { color: var(--dim); font-weight: 500; }
    #version { font-size: 10px; color: var(--dim); margin-left: auto; font-variant-numeric: tabular-nums; }

    .maint-pill {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 2px;
      color: var(--muted); font-size: 10px; font-weight: 600; white-space: nowrap;
    }
    .maint-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--dim); flex: 0 0 auto; }
    .maint-latest .maint-dot { background: var(--accent); }
    .maint-checking .maint-dot { background: var(--dim); }
    .maint-unknown .maint-dot { background: var(--dim); }
    .maint-recommended { color: var(--gold); }
    .maint-recommended .maint-dot { background: var(--gold); }
    .maint-required { color: var(--err); }
    .maint-required .maint-dot { background: var(--err); }

    /* ── hero ─────────────────────────────────────────── */
    .hero {
      display: grid; grid-template-columns: 124px 1fr; gap: 11px; align-items: start;
      margin-bottom: 12px; padding: 11px;
      border: 1px solid var(--border); border-radius: var(--r);
      background: var(--surface);
    }
    .hero-thumb {
      position: relative; overflow: hidden; border-radius: var(--r-md);
      background: #14160f; width: 124px; height: 70px; flex: 0 0 auto;
    }
    .hero-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .hero-duration {
      position: absolute; right: 5px; bottom: 5px;
      padding: 1px 5px; border-radius: 4px;
      font-size: 10px; font-weight: 700; color: #fff;
      background: rgba(0, 0, 0, 0.78); font-variant-numeric: tabular-nums;
    }
    .hero-body { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
    #video-title {
      font-size: 14.5px; font-weight: 600; color: var(--text); line-height: 1.4;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }
    #video-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; color: var(--muted); font-size: 10.5px; min-height: 16px; }
    .meta-chip { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); }
    .meta-chip + .meta-chip::before { content: '·'; margin-right: 6px; color: var(--dim); }

    /* ── status banners ───────────────────────────────── */
    #nsig-status, #pot-status, #maintenance-status {
      display: none; font-size: 10.5px; padding: 6px 9px; border-radius: var(--r-sm);
      margin-bottom: 8px; line-height: 1.4; white-space: pre-wrap; word-break: break-word;
      border: 1px solid transparent;
    }
    .nsig-ok, .pot-ok { background: rgba(143, 179, 124, 0.1); border-color: rgba(143, 179, 124, 0.24); color: var(--accent); }
    .nsig-fail, .maint-critical { background: rgba(207, 139, 126, 0.1); border-color: rgba(207, 139, 126, 0.26); color: var(--err); }
    .pot-warn, .maint-warn { background: rgba(201, 180, 122, 0.1); border-color: rgba(201, 180, 122, 0.26); color: var(--gold); }
    .maint-info { background: rgba(94, 128, 72, 0.12); border-color: rgba(94, 128, 72, 0.28); color: var(--accent); }
    #maintenance-actions { display: none; grid-template-columns: 1fr 1fr; gap: 7px; margin: -2px 0 8px; }

    #status { font-size: 12px; color: var(--muted); padding: 8px 2px; }
    #error { font-size: 12px; color: var(--err); padding: 8px 2px; display: none; }

    /* ── picker ───────────────────────────────────────── */
    #quality-picker {
      display: none; grid-template-columns: 1fr; gap: 10px; margin-bottom: 12px;
      padding: 0;
    }
    .picker-heading { margin: 0; color: var(--muted); font-size: 12.5px; font-weight: 600; letter-spacing: 0; }
    .picker-row { display: grid; grid-template-columns: 1fr; gap: 5px; }
    .picker-filters { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 7px; }
    .picker-actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 7px; }
    .picker-label { color: var(--muted); font-size: 10px; font-weight: 600; }

    .picker-select, .trim-input {
      width: 100%; min-width: 0; appearance: none; -webkit-appearance: none;
      background: var(--surface-2); color: var(--text);
      border: 1px solid var(--border); border-radius: var(--r-sm);
      padding: 7px 9px; font-size: 12px; font-family: inherit;
      transition: border-color 0.12s, box-shadow 0.12s;
    }
    .picker-select {
      padding-right: 26px;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%23948C7E' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/></svg>");
      background-repeat: no-repeat; background-position: right 9px center;
    }
    .picker-select:focus, .trim-input:focus { outline: none; border-color: var(--accent); box-shadow: var(--ring); }
    .trim-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
    .trim-range-input { grid-column: 1 / -1; }
    .trim-input::placeholder { color: var(--dim); }

    .picker-btn {
      background: var(--surface-2); color: var(--text);
      border: 1px solid var(--border-strong); border-radius: var(--r-sm);
      padding: 8px; font-size: 11px; font-weight: 600; cursor: pointer;
      transition: background 0.16s var(--ease), border-color 0.16s var(--ease), color 0.16s var(--ease);
    }
    .picker-btn:hover { background: var(--surface-3); border-color: var(--accent-deep); color: var(--accent-soft); }
    .picker-btn:active { background: #2b302a; }
    .picker-btn:disabled { background: var(--surface); color: var(--dim); border-color: var(--border); cursor: not-allowed; }

    #download-mux-selected {
      width: 100%; padding: 10px; font-size: 12px; font-weight: 700; color: var(--on-accent);
      background: var(--accent); border: none;
    }
    #download-mux-selected:hover { background: var(--accent-soft); }
    #download-mux-selected:active { background: var(--accent-deep); }
    #download-mux-selected:disabled { background: var(--surface-2); color: var(--dim); }

    #quality-note, #format-debug {
      display: none; color: var(--dim); font-size: 10px; line-height: 1.4;
      margin: -2px 0 8px; white-space: pre-wrap; word-break: break-word;
    }
    #mux-progress { display: none; color: var(--accent); font-size: 11px; line-height: 1.4; margin: 2px 0 8px; font-variant-numeric: tabular-nums; }

    /* ── sections / format list ───────────────────────── */
    .section { display: none; margin-bottom: 11px; }
    .section-label { font-size: 12.5px; font-weight: 600; color: var(--muted); letter-spacing: 0; margin-bottom: 7px; }
    .fmt-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
    .fmt-item {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 9px 4px; border-bottom: 1px solid var(--border);
      transition: background 0.16s var(--ease);
    }
    .fmt-item:first-child { border-top: 1px solid var(--border); }
    .fmt-item:hover { background: var(--surface); }
    .fmt-left { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .fmt-quality { font-weight: 600; font-size: 13px; color: var(--text); }
    .fmt-meta { font-size: 10px; color: var(--dim); }
    .fmt-actions { display: flex; gap: 6px; flex-shrink: 0; }

    .copy-btn, .maint-btn {
      background: var(--surface-2); color: var(--muted);
      border: 1px solid var(--border); border-radius: var(--r-sm);
      font-weight: 600; cursor: pointer; transition: background 0.12s, border-color 0.12s, color 0.12s;
    }
    .copy-btn { padding: 5px 9px; font-size: 10px; }
    .maint-btn { padding: 7px 8px; font-size: 11px; }
    .copy-btn:hover, .maint-btn:hover { background: var(--surface-3); color: var(--text); border-color: var(--border-strong); }

    .dl-btn {
      background: rgba(143, 179, 124, 0.13); color: var(--accent-soft);
      border: 1px solid rgba(143, 179, 124, 0.3); border-radius: var(--r-sm);
      padding: 5px 13px; font-size: 11px; font-weight: 700; cursor: pointer;
      transition: background 0.16s var(--ease), color 0.16s var(--ease), border-color 0.16s var(--ease);
    }
    .dl-btn:hover { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
    .dl-btn:active { background: var(--accent-deep); }

    hr.divider { border: none; border-top: 1px solid var(--border); margin: 10px 0; }

    :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  </style>
</head>
<body>
  <header>
    <span class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">ocha<span class="dim">-YTdl</span></span>
    </span>
    <span id="maintenance-pill" class="maint-pill maint-checking" title="互換性ステータスを確認中">
      <span class="maint-dot"></span>
      <span id="maintenance-pill-text">確認中</span>
    </span>
    <span id="version">v0.9.1</span>
  </header>

  <section class="hero" aria-label="動画情報">
    <div class="hero-thumb">
      <img id="video-thumb" alt="" loading="lazy" decoding="async">
      <div class="hero-duration" id="video-duration">--:--</div>
    </div>
    <div class="hero-body">
      <div id="video-title"></div>
      <div id="video-meta">
        <span class="meta-chip" id="video-source-chip">YouTube</span>
        <span class="meta-chip" id="video-length-chip">長さ: --:--</span>
      </div>
    </div>
  </section>
  <div id="nsig-status"></div>
  <div id="pot-status"></div>
  <div id="maintenance-status"></div>
  <div id="maintenance-actions">
    <button class="maint-btn" id="open-update-guide">更新手順</button>
    <button class="maint-btn" id="reload-extension">再読み込み</button>
  </div>
  <div id="status">読み込み中...</div>
  <div id="error"></div>

  <div id="quality-picker">
    <div class="picker-heading">品質選択</div>
    <div class="picker-filters">
      <select class="picker-select" id="video-resolution-select" aria-label="解像度"></select>
      <select class="picker-select" id="video-fps-select" aria-label="フレームレート"></select>
      <select class="picker-select" id="video-ext-select" aria-label="拡張子"></select>
    </div>
    <div class="picker-row">
      <div class="picker-label">映像フォーマット</div>
      <select class="picker-select" id="video-format-select" aria-label="映像フォーマット"></select>
    </div>
    <div class="picker-row">
      <div class="picker-label">音声フォーマット</div>
      <select class="picker-select" id="audio-format-select" aria-label="音声フォーマット"></select>
    </div>
    <div class="picker-row">
      <div class="picker-label">切り出し範囲（任意 / 例: 5-10, 0:05~0:10）</div>
      <div class="trim-inputs">
        <input class="trim-input trim-range-input" id="trim-range-input" type="text" inputmode="numeric" placeholder="範囲 0:05~0:10" aria-label="切り出し範囲">
        <input class="trim-input" id="trim-start-input" type="text" inputmode="numeric" placeholder="開始 0:05" aria-label="切り出し開始時刻">
        <input class="trim-input" id="trim-end-input" type="text" inputmode="numeric" placeholder="終了 0:10" aria-label="切り出し終了時刻">
      </div>
    </div>
    <div class="picker-actions">
      <button class="picker-btn" id="download-video-selected">映像DL</button>
      <button class="picker-btn" id="download-audio-selected">音声DL</button>
      <button class="picker-btn" id="download-pair-selected">両方DL</button>
    </div>
    <div class="picker-row">
      <button class="picker-btn" id="download-mux-selected">映像+音声を合成して保存</button>
    </div>
  </div>
  <div id="mux-progress"></div>
  <div id="quality-note"></div>
  <div id="format-debug"></div>

  <div class="section" id="section-muxed">
    <div class="section-label">動画 + 音声</div>
    <ul class="fmt-list" id="list-muxed"></ul>
  </div>

  <hr class="divider" id="divider-video" style="display:none">
  <div class="section" id="section-video">
    <div class="section-label">映像のみ</div>
    <ul class="fmt-list" id="list-video"></ul>
  </div>

  <hr class="divider" id="divider-audio" style="display:none">
  <div class="section" id="section-audio">
    <div class="section-label">音声のみ</div>
    <ul class="fmt-list" id="list-audio"></ul>
  </div>

  <iframe id="solver-iframe" src="/sandbox/solver.html" style="display:none"></iframe>
  <iframe id="muxer-iframe" src="/sandbox/muxer.html" style="display:none"></iframe>
  <script src="config/youtube.js"></script>
  <script src="popup.js"></script>
</body>
</html>
