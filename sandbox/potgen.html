<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <!-- PO Token 生成 (WebPO / BotGuard)。sandbox なので eval(new Function) が許可される。
       BotGuard VM は本物のブラウザ環境を要求するため、ここ(実iframe)で実行する。
       jnn-pa.googleapis.com への fetch は CORS で sandbox からは直接叩けないので、
       fetch だけ親(popup, host_permissions あり)へ postMessage でプロキシする。
       bgutils は classic script として window.BG を立てる（solver/muxer と同じ方式）。 -->
  <script src="../vendor/bgutils/bgutils.js"></script>
  <script>
    // YouTube web の BotGuard requestKey（公知の定数）
    var REQUEST_KEY = 'O43z0dpjhgX20SCx4KAo';

    var pendingFetches = {};
    var fetchSeq = 0;

    // bgutils に渡す fetch。親(popup)に投げて結果を受け取る。
    function proxiedFetch(url, options) {
      return new Promise(function (resolve, reject) {
        var id = 'f' + (++fetchSeq);
        pendingFetches[id] = { resolve: resolve, reject: reject };
        parent.postMessage({
          type: 'potgen-fetch',
          id: id,
          url: String(url),
          options: {
            method: options && options.method,
            headers: options && options.headers,
            body: options && options.body
          }
        }, '*');
      });
    }

    async function generate(identifier) {
      if (!window.BG) throw new Error('bgutils 読み込み失敗 (window.BG 無し)');

      var bgConfig = {
        requestKey: REQUEST_KEY,
        fetch: proxiedFetch,
        globalObj: globalThis,
        identifier: identifier || ''
      };

      var challenge = await window.BG.Challenge.create(bgConfig);
      if (!challenge) throw new Error('challenge 取得失敗');

      var interpreterJs = challenge.interpreterJavascript
        && challenge.interpreterJavascript.privateDoNotAccessOrElseSafeScriptWrappedValue;
      if (!interpreterJs) throw new Error('interpreter JS が無い');

      // BotGuard VM を評価して globalThis[globalName] にセット
      new Function(interpreterJs)();

      var result = await window.BG.PoToken.generate({
        program: challenge.program,
        globalName: challenge.globalName,
        bgConfig: bgConfig
      });

      return result.poToken;
    }

    window.addEventListener('message', async function (event) {
      var d = event.data;
      if (!d) return;

      if (d.type === 'ping') {
        parent.postMessage({ type: 'pong-potgen' }, '*');
        return;
      }

      if (d.type === 'potgen-fetch-result') {
        var p = pendingFetches[d.id];
        if (!p) return;
        delete pendingFetches[d.id];
        if (d.error) {
          p.reject(new Error(d.error));
        } else {
          p.resolve({
            ok: d.ok,
            status: d.status,
            json: async function () { return JSON.parse(d.body); },
            text: async function () { return d.body; }
          });
        }
        return;
      }

      if (d.type === 'potgen') {
        try {
          var poToken = await generate(d.identifier);
          parent.postMessage({ type: 'potgen-result', reqId: d.reqId, success: true, poToken: poToken }, '*');
        } catch (err) {
          parent.postMessage({ type: 'potgen-result', reqId: d.reqId, success: false, error: String(err && err.message || err) }, '*');
        }
      }
    });

    parent.postMessage({ type: 'potgen-ready' }, '*');
  </script>
</head>
<body></body>
</html>
