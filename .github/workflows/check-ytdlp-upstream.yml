name: Check yt-dlp upstream

on:
  workflow_dispatch:
  schedule:
    - cron: '30 18 * * *'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Update yt-dlp-derived vendor files and metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/update-ytdlp-vendor.mjs --sync-compat

      - name: Commit updated files to main
        run: |
          if git diff --quiet -- vendor/yt.solver.core.js src/generated/ytdlp-meta.json docs/compat/latest.json; then
            echo "No changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/yt.solver.core.js src/generated/ytdlp-meta.json docs/compat/latest.json
          git commit -m "Update yt-dlp-derived vendor files"
          git push origin HEAD:main
