name: Check yt-dlp upstream

on:
  workflow_dispatch:
  schedule:
    - cron: '30 18 * * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update yt-dlp-derived vendor files and metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/update-ytdlp-vendor.mjs --sync-compat

      - name: Create pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- vendor/yt.solver.core.js src/generated/ytdlp-meta.json docs/compat/latest.json; then
            echo "No changes"
            exit 0
          fi

          branch="bot/ytdlp-compat-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add vendor/yt.solver.core.js src/generated/ytdlp-meta.json docs/compat/latest.json
          git commit -m "Update yt-dlp-derived vendor files"
          git push origin "$branch"
          gh pr create \
            --title "Update yt-dlp-derived vendor files" \
            --body "yt-dlp upstream changed. This PR was generated by tools/update-ytdlp-vendor.mjs and may update the bundled EJS solver, compatibility metadata, or both. Review the diff, then test regular YouTube videos, Shorts, 360p, high-resolution video-only formats, audio-only formats, and muxing." \
            --base main \
            --head "$branch"
